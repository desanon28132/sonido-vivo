<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sonido Vivo | Carrito</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="css/style.css">


    <script src="js/storage.js"
            defer>
    </script>

    <script src="js/carrito.js"
            defer>
    </script>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                Sonido Vivo

            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="menuPrincipal">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link"
                       href="index.html">
                        Inicio
                    </a>

                    <a class="nav-link"
                       href="catalogo.html">
                        Productos
                    </a>

                    <a class="nav-link"
                       href="registro.html">
                        Registrarse
                    </a>

                    <a class="nav-link"
                       href="login.html">
                        Iniciar sesión
                    </a>

                    <a class="nav-link active"
                       href="carrito.html">

                        Carrito

                        <span id="contadorCarrito"
                              class="badge text-bg-warning">

                            0

                        </span>

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- CONTENIDO -->

    <main class="container py-5">


        <section class="mb-4">

            <span class="badge text-bg-primary mb-3">

                Compra

            </span>


            <h1 class="display-6 fw-bold">

                Carrito de compras

            </h1>


            <p class="text-secondary">

                Revisa los productos antes de finalizar tu compra.

            </p>

        </section>



        <!-- CARRITO VACIO -->

        <div id="carritoVacio"
             class="alert alert-light border text-center d-none">

            El carrito está vacío.

        </div>



        <!-- CONTENIDO CARRITO -->

        <div id="contenedorCarrito"
             class="d-none">


            <!-- TABLA -->

            <div class="table-responsive">


                <table class="table align-middle">


                    <thead>

                        <tr>

                            <th>
                                Producto
                            </th>

                            <th>
                                Cantidad
                            </th>

                            <th>
                                Precio unitario
                            </th>

                            <th>
                                Subtotal
                            </th>

                            <th>
                                Acción
                            </th>

                        </tr>

                    </thead>


                    <tbody id="listaCarrito">

                    </tbody>


                </table>


            </div>



            <!-- TOTAL -->

            <div class="row justify-content-end">


                <div class="col-md-5 col-lg-4">


                    <div class="card border-0 shadow-sm">


                        <div class="card-body">


                            <p class="text-secondary mb-1">

                                Total de la compra

                            </p>


                            <p id="totalCarrito"
                               class="display-6 fw-bold text-primary">

                                $0

                            </p>



                            <div class="d-grid gap-2">


                                <button id="btnFinalizarCompra"
                                        class="btn btn-success btn-lg">

                                    Finalizar compra

                                </button>


                                <button id="btnVaciarCarrito"
                                        class="btn btn-outline-danger">

                                    Vaciar carrito

                                </button>


                            </div>


                        </div>


                    </div>


                </div>


            </div>


        </div>



        <!-- MENSAJE -->

        <div id="mensajeCarrito"
             class="alert alert-success mt-4 d-none"
             role="alert">

        </div>


    </main>



    <footer class="py-4 bg-dark text-white">

        <div class="container text-center">

            Sonido Vivo · Nombre del equipo · DSY1104 – 2026

        </div>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
