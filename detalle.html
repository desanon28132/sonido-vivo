<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sonido Vivo | Detalle producto</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- CSS propio -->

    <link rel="stylesheet"
          href="css/style.css">


    <!-- JavaScript -->

    <script src="js/storage.js"
            defer>
    </script>

    <script src="js/detalle.js"
            defer>
    </script>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                Sonido Vivo

            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="menuPrincipal">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link"
                       href="index.html">
                        Inicio
                    </a>

                    <a class="nav-link active"
                       href="catalogo.html">
                        Productos
                    </a>

                    <a class="nav-link"
                       href="registro.html">
                        Registrarse
                    </a>

                    <a class="nav-link"
                       href="login.html">
                        Iniciar sesión
                    </a>

                    <a class="nav-link"
                       href="carrito.html">

                        Carrito

                        <span id="contadorCarrito"
                              class="badge text-bg-warning">

                            0

                        </span>

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- CONTENIDO -->

    <main class="container py-5">


        <div class="row justify-content-center">


            <div class="col-lg-9">


                <a href="catalogo.html"
                   class="btn btn-outline-secondary mb-4">

                    Volver al catálogo

                </a>



                <!-- FICHA PRODUCTO -->

                <section id="fichaProducto"
                         class="card shadow-sm border-0 d-none">


                    <div class="card-body p-4 p-md-5">


                        <div class="row g-4 align-items-center">


                            <!-- IMAGEN -->

                            <div class="col-md-6">

                                <img id="imagenProducto"
                                     class="detalle-img"
                                     src="img/producto.svg"
                                     alt="Imagen del producto">

                            </div>



                            <!-- INFORMACION -->

                            <div class="col-md-6">


                                <span id="categoriaProducto"
                                      class="badge text-bg-secondary mb-3">

                                </span>


                                <h1 id="nombreProducto"
                                    class="h2 fw-bold">

                                </h1>


                                <p id="descripcionProducto"
                                   class="text-secondary">

                                </p>



                                <p class="detail-label">
                                    Precio
                                </p>


                                <p id="precioProducto"
                                   class="detail-value fs-4 text-primary fw-bold">

                                </p>



                                <p class="detail-label">
                                    Disponibilidad
                                </p>


                                <p id="stockProducto"
                                   class="detail-value">

                                </p>



                                <div class="d-grid mt-4">

                                    <button id="btnAgregarCarrito"
                                            class="btn btn-primary btn-lg">

                                        Agregar al carrito

                                    </button>

                                </div>



                                <div id="mensajeDetalle"
                                     class="alert alert-success mt-4 d-none"
                                     role="alert">

                                </div>


                            </div>


                        </div>


                    </div>

                </section>



                <!-- PRODUCTO NO ENCONTRADO -->

                <div id="productoNoEncontrado"
                     class="alert alert-warning d-none">

                    No se encontró el producto solicitado.

                </div>


            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="py-4 bg-dark text-white">

        <div class="container text-center">

            Sonido Vivo · Nombre del equipo · DSY1104 – 2026

        </div>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
