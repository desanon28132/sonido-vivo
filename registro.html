<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sonido Vivo | Registro</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- CSS propio -->

    <link rel="stylesheet"
          href="css/style.css">


    <!-- JavaScript -->

    <script src="js/storage.js"
            defer>
    </script>

    <script src="js/registro.js"
            defer>
    </script>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                Sonido Vivo

            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="menuPrincipal">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link"
                       href="index.html">
                        Inicio
                    </a>

                    <a class="nav-link"
                       href="catalogo.html">
                        Productos
                    </a>

                    <a class="nav-link active"
                       href="registro.html">
                        Registrarse
                    </a>

                    <a class="nav-link"
                       href="login.html">
                        Iniciar sesión
                    </a>

                    <a class="nav-link"
                       href="carrito.html">
                        Carrito
                        <span id="contadorCarrito"
                              class="badge text-bg-warning">
                            0
                        </span>
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- CONTENIDO -->

    <main class="container py-5">


        <div class="row justify-content-center">


            <div class="col-lg-10">


                <!-- TITULO -->

                <section class="mb-4 text-center">

                    <span class="badge text-bg-secondary mb-3">
                        Clientes
                    </span>


                    <h1 class="display-6 fw-bold">
                        Crear cuenta
                    </h1>


                    <p class="text-secondary">

                        Ingresa tus datos para registrarte
                        en Sonido Vivo.

                    </p>

                </section>



                <!-- FORMULARIO -->

                <section class="card shadow-sm border-0">


                    <div class="card-body p-4 p-md-5">


                        <form id="formRegistro">


                            <div class="row g-3">


                                <!-- NOMBRE -->

                                <div class="col-md-6">

                                    <label for="nombre"
                                           class="form-label">

                                        Nombre

                                    </label>


                                    <input type="text"
                                           class="form-control"
                                           id="nombre">

                                </div>



                                <!-- APELLIDO -->

                                <div class="col-md-6">

                                    <label for="apellido"
                                           class="form-label">

                                        Apellido

                                    </label>


                                    <input type="text"
                                           class="form-control"
                                           id="apellido">

                                </div>



                                <!-- FECHA -->

                                <div class="col-md-6">

                                    <label for="fechaNacimiento"
                                           class="form-label">

                                        Fecha de nacimiento

                                    </label>


                                    <input type="date"
                                           class="form-control"
                                           id="fechaNacimiento">

                                </div>



                                <!-- CORREO -->

                                <div class="col-md-6">

                                    <label for="correo"
                                           class="form-label">

                                        Correo electrónico

                                    </label>


                                    <input type="text"
                                           class="form-control"
                                           id="correo"
                                           placeholder="nombre@duoc.cl">

                                </div>



                                <!-- PASSWORD -->

                                <div class="col-md-6">

                                    <label for="password"
                                           class="form-label">

                                        Contraseña

                                    </label>


                                    <input type="password"
                                           class="form-control"
                                           id="password">

                                </div>



                                <!-- CONFIRMAR -->

                                <div class="col-md-6">

                                    <label for="confirmarPassword"
                                           class="form-label">

                                        Confirmar contraseña

                                    </label>


                                    <input type="password"
                                           class="form-control"
                                           id="confirmarPassword">

                                </div>



                                <!-- DIRECCION -->

                                <div class="col-12">

                                    <label for="direccion"
                                           class="form-label">

                                        Dirección

                                    </label>


                                    <input type="text"
                                           class="form-control"
                                           id="direccion">

                                </div>



                                <!-- REGION -->

                                <div class="col-md-6">

                                    <label for="region"
                                           class="form-label">

                                        Región

                                    </label>


                                    <select id="region"
                                            class="form-select">

                                        <option value="">
                                            Seleccione una región
                                        </option>

                                        <option value="Valparaíso">
                                            Valparaíso
                                        </option>

                                        <option value="Metropolitana">
                                            Metropolitana
                                        </option>

                                        <option value="O'Higgins">
                                            O'Higgins
                                        </option>

                                        <option value="Maule">
                                            Maule
                                        </option>

                                        <option value="Biobío">
                                            Biobío
                                        </option>

                                        <option value="La Araucanía">
                                            La Araucanía
                                        </option>

                                        <option value="Los Lagos">
                                            Los Lagos
                                        </option>

                                    </select>

                                </div>



                                <!-- GENERO -->

                                <div class="col-md-6">

                                    <label for="genero"
                                           class="form-label">

                                        Género

                                    </label>


                                    <select id="genero"
                                            class="form-select">

                                        <option value="">
                                            Seleccione una opción
                                        </option>

                                        <option value="Masculino">
                                            Masculino
                                        </option>

                                        <option value="Femenino">
                                            Femenino
                                        </option>

                                        <option value="Otro">
                                            Otro
                                        </option>

                                        <option value="Prefiero no indicar">
                                            Prefiero no indicar
                                        </option>

                                    </select>

                                </div>



                                <!-- TERMINOS -->

                                <div class="col-12">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="condiciones">


                                        <label class="form-check-label"
                                               for="condiciones">

                                            Acepto las condiciones
                                            de registro.

                                        </label>

                                    </div>

                                </div>



                                <!-- BOTON -->

                                <div class="col-12 d-grid mt-4">

                                    <button type="submit"
                                            class="btn btn-primary btn-lg">

                                        Registrarme

                                    </button>

                                </div>


                            </div>


                        </form>



                        <!-- MENSAJE -->

                        <div id="mensajeRegistro"
                             class="alert alert-success mt-4 d-none"
                             role="alert">

                        </div>


                    </div>

                </section>


            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="py-4 bg-dark text-white">

        <div class="container text-center">

            Sonido Vivo · Nombre del equipo · DSY1104 – 2026

        </div>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
