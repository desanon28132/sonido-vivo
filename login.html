<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sonido Vivo | Iniciar sesión</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- CSS propio -->

    <link rel="stylesheet"
          href="css/style.css">


    <!-- JavaScript -->

    <script src="js/storage.js"
            defer>
    </script>

    <script src="js/login.js"
            defer>
    </script>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                Sonido Vivo

            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="menuPrincipal">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link"
                       href="index.html">

                        Inicio

                    </a>


                    <a class="nav-link"
                       href="catalogo.html">

                        Productos

                    </a>


                    <a class="nav-link"
                       href="registro.html">

                        Registrarse

                    </a>


                    <a class="nav-link active"
                       href="login.html">

                        Iniciar sesión

                    </a>


                    <a class="nav-link"
                       href="carrito.html">

                        Carrito

                        <span id="contadorCarrito"
                              class="badge text-bg-warning">

                            0

                        </span>

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- CONTENIDO -->

    <main class="container py-5">


        <div class="row justify-content-center">


            <div class="col-md-8 col-lg-5">


                <!-- TITULO -->

                <section class="mb-4 text-center">

                    <span class="badge text-bg-secondary mb-3">

                        Acceso

                    </span>


                    <h1 class="display-6 fw-bold">

                        Iniciar sesión

                    </h1>


                    <p class="text-secondary">

                        Ingresa con tu correo y contraseña.

                    </p>

                </section>



                <!-- FORMULARIO -->

                <section class="card shadow-sm border-0">


                    <div class="card-body p-4 p-md-5">


                        <form id="formLogin">


                            <!-- CORREO -->

                            <div class="mb-3">

                                <label for="correo"
                                       class="form-label">

                                    Correo electrónico

                                </label>


                                <input type="text"
                                       class="form-control"
                                       id="correo">

                            </div>



                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label for="password"
                                       class="form-label">

                                    Contraseña

                                </label>


                                <input type="password"
                                       class="form-control"
                                       id="password">

                            </div>



                            <!-- BOTON -->

                            <div class="d-grid mt-4">

                                <button type="submit"
                                        class="btn btn-primary btn-lg">

                                    Ingresar

                                </button>

                            </div>


                        </form>



                        <!-- MENSAJE -->

                        <div id="mensajeLogin"
                             class="alert alert-danger mt-4 d-none"
                             role="alert">

                        </div>



                        <p class="text-center text-secondary mt-4 mb-0">

                            ¿No tienes una cuenta?

                            <a href="registro.html">

                                Regístrate aquí

                            </a>

                        </p>


                    </div>

                </section>


            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="py-4 bg-dark text-white">

        <div class="container text-center">

            Sonido Vivo · Nombre del equipo · DSY1104 – 2026

        </div>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
